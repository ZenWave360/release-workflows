name: Build and publish Gradle npm packages (reusable)

on:
  workflow_call:
    inputs:
      npm-script:
        description: "Repository helper implementing version, verify and publish commands; its sibling .test.mjs verifies version rules"
        type: string
        default: scripts/npm-packages.mjs
      smoke-script:
        description: "Repository script that installs and tests the generated tarballs"
        type: string
        default: scripts/npm-smoke.sh
      java-version:
        type: string
        default: "21"
      node-version:
        type: string
        default: "24"
      gradle-arguments:
        description: "Additional whitespace-separated Gradle arguments; npmVersion is supplied by this workflow"
        type: string
        default: "-PuseLocalDependencies=false"
      artifact-path:
        type: string
        default: build/npm/*.tgz
      ref:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      snapshot:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false
      environment:
        required: false
        type: string
        default: "npm-publish"

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout source or release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Determine shared npm version
        id: version
        env:
          NPM_SCRIPT: ${{ inputs.npm-script }}
          NPM_VERSION: ${{ inputs.version }}
          SNAPSHOT_BUILD: ${{ inputs.snapshot && format('{0}.{1}', github.run_number, github.run_attempt) || '' }}
        run: |
          set -euo pipefail
          node --test "${NPM_SCRIPT%.mjs}.test.mjs"
          VERSION="$(node "$NPM_SCRIPT" version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build, test and generate tarballs
        env:
          NPM_SCRIPT: ${{ inputs.npm-script }}
          GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          read -r -a GRADLE_ARGS <<< "$GRADLE_ARGUMENTS"
          ./gradlew --no-daemon build npmPack "${GRADLE_ARGS[@]}" "-PnpmVersion=$NPM_VERSION"
          node "$NPM_SCRIPT" verify "$NPM_VERSION"
      - name: Exercise freshly installed packages
        env:
          NPM_VERSION: ${{ steps.version.outputs.version }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: bash "$SMOKE_SCRIPT"
      - name: Upload verified npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish npm packages via trusted publishing
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-packages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout the exact build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/
      - name: Download verified tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: build/npm
      - name: Verify and publish the complete version set
        env:
          NPM_SCRIPT: ${{ inputs.npm-script }}
          NPM_VERSION: ${{ needs.build.outputs.version }}
        run: node "$NPM_SCRIPT" publish "$NPM_VERSION"
