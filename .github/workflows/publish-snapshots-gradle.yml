name: Publish Gradle snapshot (reusable)

# Security model: see release-maven.yml/release-gradle.yml's headers -- same
# principle. `environment:` and `secrets:` resolve against the CALLING
# repository. Callers pass secrets explicitly by name -- never
# `secrets: inherit`.
#
# This reusable workflow has no `on:` trigger of its own (workflow_call
# reusable workflows can't also declare push/schedule triggers that would
# fire in THIS repo) -- the caller keeps its own thin
# `publish-maven-snapshots.yml` with `on: push: branches: [develop, next]`
# and calls this as a single job. The branch check below is defense in
# depth on top of the caller's trigger filter and the environment's
# deployment branch policy (the actual hard boundary).
on:
  workflow_call:
    inputs:
      gradle-arguments:
        description: "Additional whitespace-separated Gradle arguments passed to every build and publish invocation"
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "17"
      java-distribution:
        required: false
        type: string
        default: "temurin"
      node-version:
        required: false
        type: string
        default: "18"
      snapshot-environment:
        description: "Name of the GitHub Environment (in the caller repo) gating snapshot publication"
        required: false
        type: string
        default: "maven-central-snapshots"
      develop-branch:
        required: false
        type: string
        default: "develop"
      next-branch:
        required: false
        type: string
        default: "next"
      kover-xml-files:
        description: "Newline- or space-separated list of Kover report.xml paths (one per module) to feed the badge generator. Defaults to the standard single-module Gradle layout; multi-module repos must override with their per-module list."
        required: false
        type: string
        default: "./build/reports/kover/report.xml"
      publish-npm:
        description: "Publish a unique npm prerelease to next after Maven snapshot publication"
        required: false
        type: boolean
        default: false
      npm-package:
        required: false
        type: string
        default: ""
      npm-package-dir:
        required: false
        type: string
        default: ""
      npm-environment:
        required: false
        type: string
        default: "npm-snapshots"
      npm-node-version:
        required: false
        type: string
        default: "24"
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_TOKEN:
        required: true
      SIGN_KEY:
        required: true
      SIGN_KEY_PASS:
        required: true

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Build, test and publish snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Defense in depth; the environment branch policy is the hard boundary.
    if: github.ref == format('refs/heads/{0}', inputs.develop-branch) || github.ref == format('refs/heads/{0}', inputs.next-branch)
    environment: ${{ inputs.snapshot-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The committed gradle-wrapper.jar is executable code: verify its
      # checksum against Gradle's published checksums before running it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: "gradle"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # Guard against accidentally publishing a release version as a snapshot.
      # Runs without secrets in the environment.
      - name: Enforce snapshot version
        run: |
          set -euo pipefail
          if ! grep -qE '^version = "[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT"$' build.gradle.kts; then
            echo "::error::build.gradle.kts version is not a -SNAPSHOT; refusing to publish a snapshot."
            grep '^version = ' build.gradle.kts || true
            exit 1
          fi

      - name: Build and test with coverage
        env:
          GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
        run: |
          chmod +x gradlew
          read -r -a GRADLE_ARGS <<< "$GRADLE_ARGUMENTS"
          ./gradlew build koverHtmlReport koverXmlReport koverLog "${GRADLE_ARGS[@]}"

      - name: Extract coverage metrics
        if: always()
        env:
          KOVER_XML_FILES: ${{ inputs.kover-xml-files }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          metrics = {}
          reports = [Path(path) for path in os.environ["KOVER_XML_FILES"].split()]
          if not reports:
              raise SystemExit("KOVER_XML_FILES must name at least one Kover XML report.")

          missing_reports = [str(path) for path in reports if not path.is_file()]
          if missing_reports:
              raise SystemExit("Missing Kover XML report(s): " + ", ".join(missing_reports))

          for report in reports:
              root = ET.parse(report).getroot()
              for counter in root.findall("counter"):
                  counter_type = counter.attrib["type"]
                  totals = metrics.setdefault(counter_type, {"missed": 0, "covered": 0})
                  totals["missed"] += int(counter.attrib["missed"])
                  totals["covered"] += int(counter.attrib["covered"])

          percentages = {}
          for counter_type, totals in metrics.items():
              missed = totals["missed"]
              covered = totals["covered"]
              total = covered + missed
              percent = 100.0 * covered / total if total else 0.0
              percentages[counter_type] = round(percent)

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as env:
              env.write(f"LINE_COVERAGE={percentages.get('LINE', 0)}\n")
              env.write(f"BRANCH_COVERAGE={percentages.get('BRANCH', 0)}\n")
          PY

      - name: Print coverage to console
        if: always()
        run: |
          echo "line coverage = ${LINE_COVERAGE}%"
          echo "branch coverage = ${BRANCH_COVERAGE}%"

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Kover Test Coverage Summary"
            echo
            echo "- Coverage: ${LINE_COVERAGE}%"
            echo "- Branches: ${BRANCH_COVERAGE}%"
            echo "- Generated by: Kover XML report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-reports
          path: |
            **/build/reports/kover/
            **/build/reports/tests/

      # Secrets are scoped to this single step. Everything Gradle runs here
      # (plugins, dependencies, Kotlin/JS tooling) executes with the snapshot
      # credentials present -- that is the documented residual risk of
      # snapshot publishing.
      - name: Publish snapshots to Maven Central
        run: |
          read -r -a GRADLE_ARGS <<< "$GRADLE_ARGUMENTS"
          ./gradlew publishToMavenCentral "${GRADLE_ARGS[@]}"
        env:
          GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGN_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGN_KEY_PASS }}

  publish-npm-snapshot:
    name: Publish npm snapshot to next
    needs: publish-snapshot
    if: inputs.publish-npm && (github.ref == format('refs/heads/{0}', inputs.develop-branch) || github.ref == format('refs/heads/{0}', inputs.next-branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.npm-environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-snapshots-${{ inputs.npm-package }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.npm-node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Build and test a unique npm snapshot
        env:
          GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
          SNAPSHOT_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
          NPM_PACKAGE: ${{ inputs.npm-package }}
          PKG_DIR: ${{ inputs.npm-package-dir }}
        run: |
          set -euo pipefail
          test -n "${NPM_PACKAGE}"
          test -n "${PKG_DIR}"
          grep -qE '^version = "[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT"$' build.gradle.kts
          chmod +x gradlew
          read -r -a GRADLE_ARGS <<< "$GRADLE_ARGUMENTS"
          ./gradlew --no-daemon build "${GRADLE_ARGS[@]}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = `${process.env.PKG_DIR}/package.json`;
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const source = fs.readFileSync('build.gradle.kts', 'utf8');
          const base = source.match(/^version = "(\d+\.\d+\.\d+)-SNAPSHOT"$/m)?.[1];
          const expected = `${base}-next.${process.env.SNAPSHOT_BUILD}`;
          const compatible = [`${base}-SNAPSHOT`, `${base}-next.0`, expected];
          if (!base || pkg.name !== process.env.NPM_PACKAGE || !compatible.includes(pkg.version) || Object.keys(pkg.scripts ?? {}).length) {
            throw new Error(`Unexpected npm snapshot metadata; expected ${process.env.NPM_PACKAGE} from ${base}-SNAPSHOT without lifecycle scripts`);
          }
          pkg.version = expected;
          pkg.publishConfig = {...pkg.publishConfig, access: 'public', registry: 'https://registry.npmjs.org/', tag: 'next'};
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          NODE

      - name: Pack and publish to next
        env:
          PKG_DIR: ${{ inputs.npm-package-dir }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/npm"
          npm pack "./${PKG_DIR}" --ignore-scripts --pack-destination "${RUNNER_TEMP}/npm"
          tarballs=("${RUNNER_TEMP}"/npm/*.tgz)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --ignore-scripts --access public --tag next --provenance
