name: Publish Maven snapshot (reusable)

# Security model: see release-maven.yml/release-gradle.yml's headers -- same
# principle. `environment:` and `secrets:` resolve against the CALLING
# repository. Callers pass secrets explicitly by name -- never
# `secrets: inherit`.
#
# This reusable workflow has no `on:` trigger of its own (workflow_call
# reusable workflows can't also declare push/schedule triggers that would
# fire in THIS repo) -- the caller keeps its own thin
# `publish-maven-snapshots.yml` with `on: push: branches: [develop, next]`
# and calls this as a single job. The branch check below is defense in
# depth on top of the caller's trigger filter and the environment's
# deployment branch policy (the actual hard boundary).
#
# Callers need, in pom.xml, an enforcer-plugin execution with id
# `enforce-snapshot-version` that fails unless the project version ends in
# `-SNAPSHOT` -- this workflow invokes it by that exact id.
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
      java-distribution:
        required: false
        type: string
        default: "temurin"
      snapshot-environment:
        description: "Name of the GitHub Environment (in the caller repo) gating snapshot publication"
        required: false
        type: string
        default: "maven-central-snapshots"
      develop-branch:
        required: false
        type: string
        default: "develop"
      next-branch:
        required: false
        type: string
        default: "next"
      publish-snapshots:
        description: "Publish the snapshot to Maven Central after build and tests. When false, the project is only built and tested."
        required: false
        type: boolean
        default: false
      publish-git-snapshots:
        description: "Publish the snapshot with git-maven-publisher to a Git-hosted Maven repository (git-snapshots-repository, branch git-snapshots-branch). Independent of publish-snapshots."
        required: false
        type: boolean
        default: false
      git-snapshots-repository:
        description: "HTTPS URL of the Git repository that holds the snapshots"
        required: false
        type: string
        default: "https://github.com/zenwave360/maven-snapshots.git"
      git-snapshots-branch:
        description: "Branch of git-snapshots-repository that is served as a Maven repository"
        required: false
        type: string
        default: "gh-pages"
      git-snapshots-url:
        description: "URL that serves git-snapshots-branch as a Maven repository; the git-maven-publisher plugin snapshot is resolved from it"
        required: false
        type: string
        default: "https://www.zenwave360.io/maven-snapshots/"
      git-publisher-version:
        description: "Version of io.github.ivangsa:git-maven-publisher-maven-plugin"
        required: false
        type: string
        default: "0.1.0-SNAPSHOT"
      jacoco-csv-files:
        description: "Newline- or space-separated list of jacoco.csv paths (one per module) to compute the aggregate coverage percentage from. Defaults to the standard single-module Maven layout; multi-module repos must override with their per-module list."
        required: false
        type: string
        default: "./target/site/jacoco/jacoco.csv"
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_TOKEN:
        required: true
      SIGN_KEY:
        required: true
      SIGN_KEY_PASS:
        required: true
      GIT_PUBLISHER_TOKEN:
        description: "Token with Contents: write on git-snapshots-repository; required when publish-git-snapshots is true"
        required: false

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Build and publish snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Defense in depth; the environment branch policy is the hard boundary.
    if: github.ref == format('refs/heads/{0}', inputs.develop-branch) || github.ref == format('refs/heads/{0}', inputs.next-branch)
    environment: ${{ inputs.snapshot-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # Maven 3.10+ only sends credentials to explicitly declared origins.
          mvn-server-repository-origins: |
            central:https://central.sonatype.com

      # Guard against accidentally publishing a release version as a snapshot.
      # Runs without secrets in the environment.
      - name: Enforce snapshot version
        if: inputs.publish-snapshots || inputs.publish-git-snapshots
        run: mvn -B -ntp enforcer:enforce@enforce-snapshot-version

      # Secrets are scoped to this single step. Everything Maven runs here
      # (plugins, tests, dependencies) executes with the snapshot credentials
      # present -- that is the documented residual risk of snapshot publishing.
      - name: Build and test (no publishing)
        if: ${{ !inputs.publish-snapshots }}
        run: mvn -B -ntp verify -Dmaven.javadoc.skip=false

      - name: Publish snapshot to Maven Central snapshots repository
        if: inputs.publish-snapshots
        run: mvn -B -ntp deploy -DdeployAtEnd=true -Dmaven.javadoc.skip=false
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

      # git-maven-publisher (https://github.com/ivangsa/git-maven-publisher): deploys the reactor's snapshots into a branch
      # of a Git repository in one commit. Tests already ran in one of the two steps above, so this step only packages.
      # The plugin snapshot is resolved from git-snapshots-url through a throwaway settings file (pluginRepository only,
      # no servers, no credentials). The token reaches Maven only as the env GIT_PUBLISHER_TOKEN of this step; the plugin
      # never writes it into the URL, the Git config or a log line.
      - name: Publish snapshot to the Git repository
        if: inputs.publish-git-snapshots
        env:
          GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}
          GIT_SNAPSHOTS_REPOSITORY: ${{ inputs.git-snapshots-repository }}
          GIT_SNAPSHOTS_BRANCH: ${{ inputs.git-snapshots-branch }}
          GIT_SNAPSHOTS_URL: ${{ inputs.git-snapshots-url }}
          GIT_PUBLISHER_VERSION: ${{ inputs.git-publisher-version }}
        run: |
          if [ -z "${GIT_PUBLISHER_TOKEN}" ]; then
            echo "::error::publish-git-snapshots is true but the GIT_PUBLISHER_TOKEN secret is not set in environment ${{ inputs.snapshot-environment }}"
            exit 1
          fi
          settings="${RUNNER_TEMP}/git-publisher-settings.xml"
          cat > "${settings}" <<EOF
          <settings>
            <profiles>
              <profile>
                <id>git-publisher</id>
                <pluginRepositories>
                  <pluginRepository>
                    <id>git-maven-snapshots</id>
                    <url>${GIT_SNAPSHOTS_URL}</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>git-publisher</activeProfile></activeProfiles>
          </settings>
          EOF
          mvn -B -ntp -s "${settings}" package -DskipTests \
            "io.github.ivangsa:git-maven-publisher-maven-plugin:${GIT_PUBLISHER_VERSION}:deploy" \
            "-Dgit-publisher.repository=${GIT_SNAPSHOTS_REPOSITORY}" \
            "-Dgit-publisher.branch=${GIT_SNAPSHOTS_BRANCH}"

      # No secrets in this step's env. Only computes the aggregate coverage
      # percentage from the jacoco.csv files the deploy step's test run just
      # produced -- writes to a throwaway directory, never checked out from
      # or pushed to the badges branch (that stays main-maven.yml's job only,
      # to avoid running a third-party action + git push in the same job as
      # publication secrets for no benefit). This step exists purely to print
      # the number for this branch specifically, since main-maven.yml only
      # ever reflects main's coverage, not develop/next's.
      - name: Compute aggregate JaCoCo coverage
        id: jacoco
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          badges-directory: /tmp/jacoco-coverage-summary
          generate-branches-badge: true
          generate-summary: true
          jacoco-csv-file: ${{ inputs.jacoco-csv-files }}

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"
          {
            echo "### Snapshot coverage (this branch)"
            echo "- Coverage: ${{ steps.jacoco.outputs.coverage }}%"
            echo "- Branches: ${{ steps.jacoco.outputs.branches }}%"
          } >> "${GITHUB_STEP_SUMMARY}"
